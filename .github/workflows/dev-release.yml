name: Dev Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve dev version
        id: version
        run: |
          BASE_VERSION="$(plutil -extract CFBundleShortVersionString raw Info.plist)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          BUILD_TAG="dev-${SHORT_SHA}"

          echo "tag=dev" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Stamp app version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Info.plist
          plutil -replace MisprFlowBuildTag -string "${{ steps.version.outputs.build_tag }}" Info.plist

      - name: Install build tools
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install create-dmg fileicon

      # --- Code signing setup ---
      # Required GitHub secrets:
      #   DEVELOPER_ID_CERTIFICATE_BASE64 - base64-encoded .p12 Developer ID certificate
      #   DEVELOPER_ID_CERTIFICATE_PASSWORD - password for the .p12
      #   APPLE_ID - Apple ID email for notarization
      #   APPLE_TEAM_ID - 10-character Apple Team ID
      #   APPLE_APP_PASSWORD - app-specific password for notarization
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          # Fail fast when signing secrets are missing (fresh forks/copies
          # do not inherit secrets). Without this, `security import` fails
          # cryptically with "Unable to decode the provided data".
          if [[ -z "${CERTIFICATE_BASE64:-}" ]]; then
            echo "::error::Missing DEVELOPER_ID_CERTIFICATE_BASE64 secret. Export the Developer ID identity (certificate AND private key) as a .p12 and set it with: base64 -i certificate.p12 | gh secret set DEVELOPER_ID_CERTIFICATE_BASE64 --repo \"$GITHUB_REPOSITORY\""
            exit 1
          fi
          if [[ -z "${CERTIFICATE_PASSWORD:-}" ]]; then
            echo "::error::Missing DEVELOPER_ID_CERTIFICATE_PASSWORD secret. Set it with: gh secret set DEVELOPER_ID_CERTIFICATE_PASSWORD --repo \"$GITHUB_REPOSITORY\""
            exit 1
          fi

          # Decode certificate
          if ! echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_BASE64 did not base64-decode. Re-export the .p12 and reset the secret."
            exit 1
          fi
          if [[ ! -s "$CERTIFICATE_PATH" ]]; then
            echo "::error::Decoded .p12 is empty. Re-export the .p12 and reset DEVELOPER_ID_CERTIFICATE_BASE64."
            exit 1
          fi

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the identity and delete the .p12 from disk immediately.
          # The .p12 must contain BOTH the Developer ID Application
          # certificate and its private key. A key-only .p12 imports without
          # error but yields no usable signing identity.
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          # Allow codesign to access the keychain without UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temporary keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Require a valid "Developer ID Application" identity. Without this
          # check a key-only .p12 silently sets CODESIGN_IDENTITY to
          # "0 valid identities found" and fails later inside codesign.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/^[[:space:]]*[0-9][0-9]*) [0-9A-F]\{40\} "\(Developer ID Application: .*\)"[[:space:]]*$/\1/p' \
            | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No valid Developer ID Application identity was imported. DEVELOPER_ID_CERTIFICATE_BASE64 must be a .p12 containing the certificate AND its private key. Export the identity from Keychain Access (My Certificates), not just the key."
            echo "Matching code-signing identities, including invalid ones:"
            security find-identity -p codesigning "$KEYCHAIN_PATH" || true
            echo "Developer ID certificates in the temporary keychain:"
            security find-certificate -a -c "Developer ID Application" -p "$KEYCHAIN_PATH" \
              | openssl x509 -noout -subject -issuer -dates || true
            exit 1
          fi

          CERT_TEAM="$(printf '%s\n' "$IDENTITY" | sed -n 's/.*(\([A-Z0-9][A-Z0-9]*\))$/\1/p')"
          if [[ -n "${APPLE_TEAM_ID:-}" && -n "$CERT_TEAM" && "$CERT_TEAM" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::Certificate team ($CERT_TEAM) does not match APPLE_TEAM_ID ($APPLE_TEAM_ID)."
            exit 1
          fi

          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Found signing identity: $IDENTITY"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo "::error::Missing notarization secrets. APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD must all be set."
            exit 1
          fi

          # A 401 "Apple ID has been locked" here is an account-state problem.
          # Unlock the account at https://iforgot.apple.com, then create a new
          # app-specific password at https://appleid.apple.com and update the
          # APPLE_APP_PASSWORD secret before re-running the workflow.
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      # --- Build universal dev app ---
      - name: Build universal
        run: make ARCH=universal CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Create universal DMG
        run: make dmg ARCH=universal CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Sign universal DMG
        run: codesign --force --sign "$CODESIGN_IDENTITY" "build/MisprFlow Dev.dmg"

      - name: Notarize universal DMG
        run: |
          xcrun notarytool submit "build/MisprFlow Dev.dmg" \
            --keychain-profile "notarytool-profile" \
            --keychain "$KEYCHAIN_PATH" \
            --wait
          xcrun stapler staple "build/MisprFlow Dev.dmg"

      - name: Save universal DMG
        run: mv "build/MisprFlow Dev.dmg" MisprFlow-Dev.dmg

      - name: Move dev tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTHORIZATION="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTHORIZATION"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git tag --force "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${{ steps.version.outputs.tag }}"

      # --- Release ---
      - name: Create or update dev release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MisprFlow Dev ${{ steps.version.outputs.short_sha }}
          body: |
            Development build from `${{ github.sha }}`.

            **[MisprFlow-Dev.dmg](https://github.com/Mukku27/MisprFlow/releases/download/${{ steps.version.outputs.tag }}/MisprFlow-Dev.dmg)** - Universal dev build for all Macs (Apple Silicon + Intel).
          generate_release_notes: false
          make_latest: false
          prerelease: true
          files: |
            MisprFlow-Dev.dmg

      # --- Cleanup ---
      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
