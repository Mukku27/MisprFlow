name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.3.1." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp app version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Info.plist
          plutil -replace MisprFlowBuildTag -string "${{ steps.version.outputs.tag }}" Info.plist

      - name: Build release notes from changelog
        id: release_notes
        run: |
          .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## Download"
            echo
            echo "**[MisprFlow.dmg](https://github.com/Mukku27/MisprFlow/releases/download/${{ steps.version.outputs.tag }}/MisprFlow.dmg)** — Universal build for all Macs (Apple Silicon + Intel)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install create-dmg fileicon

      # --- Code signing setup ---
      # Required GitHub secrets:
      #   DEVELOPER_ID_CERTIFICATE_BASE64 — base64-encoded .p12 Developer ID certificate
      #   DEVELOPER_ID_CERTIFICATE_PASSWORD — password for the .p12
      # Notarization uses an App Store Connect API key when all three are set:
      #   APPLE_API_KEY_BASE64 — base64-encoded AuthKey_XXXX.p8
      #   APPLE_API_KEY_ID — 10-character key ID
      #   APPLE_API_ISSUER — issuer UUID
      # Otherwise it uses the Apple ID app-specific password:
      #   APPLE_ID — Apple ID email for notarization
      #   APPLE_TEAM_ID — 10-character Apple Team ID
      #   APPLE_APP_PASSWORD — app-specific password for notarization
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/prepare-signing.sh

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash .github/scripts/prepare-notarization.sh

      # --- Build universal ---
      - name: Build universal
        run: make ARCH=universal APP_NAME=MisprFlow BUNDLE_ID=com.mukku27.misprflow CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Create universal DMG
        run: make dmg ARCH=universal APP_NAME=MisprFlow BUNDLE_ID=com.mukku27.misprflow CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Sign universal DMG
        run: codesign --force --sign "$CODESIGN_IDENTITY" build/MisprFlow.dmg

      - name: Notarize universal DMG
        run: |
          xcrun notarytool submit build/MisprFlow.dmg \
            --keychain-profile "notarytool-profile" \
            --keychain "$KEYCHAIN_PATH" \
            --wait
          xcrun stapler staple build/MisprFlow.dmg

      - name: Save universal DMG
        run: mv build/MisprFlow.dmg MisprFlow.dmg

      # --- Release ---
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MisprFlow ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
          make_latest: true
          files: |
            MisprFlow.dmg

      # --- Cleanup ---
      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "$RUNNER_TEMP/keychain-partition.txt" \
            "$RUNNER_TEMP/signing-identity-error.txt"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
